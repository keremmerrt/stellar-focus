<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Confirmed — Stellar Focus</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0A0820;
      color: #E8E4F0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #16122E;
      border: 1px solid #2A2550;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .icon { font-size: 56px; margin-bottom: 20px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 12px; }
    p { color: #9B97B2; font-size: 15px; line-height: 1.6; margin-bottom: 8px; }
    .app-name { color: #7B6FE8; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✦</div>
    <h1>Email Confirmed!</h1>
    <p>Your <span class="app-name">Stellar Focus</span> account is ready.</p>
    <p>Return to the app and sign in with your email and password.</p>
  </div>
</body>
</html>
